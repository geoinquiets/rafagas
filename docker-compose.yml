services:
  jekyll:
    build:
      context: .
      dockerfile: Dockerfile.jekyll
    working_dir: /srv/jekyll
    command: sh -c "bundle install && bundle exec jekyll serve --watch --force_polling --incremental --host 0.0.0.0 --port 8000 --livereload --livereload-port --future --drafts --config _config.yml,_config.dev.yml"
    volumes:
      - ".:/srv/jekyll:Z"
      - /srv/jekyll/crawl_sites
      - /srv/jekyll/crawl
      - bundle_cache:/usr/local/bundle
    ports:
      - '8000:8000'
      - '35729:35729'
    extra_hosts:
      - "api.github.com:127.0.0.1"
    environment:
      RUBYOPT: '-W0'
      JEKYLL_ENV: development
      BUNDLE_PATH: /usr/local/bundle

  scripts:
    profiles:
      - scripts
    build:
      context: .
      dockerfile: Dockerfile.scripts
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    group_add:
      - "${DOCKER_SOCKET_GID}"
    volumes:
      - ".:/app:Z"
      - /var/run/docker.sock:/var/run/docker.sock
      - uv_cache:/tmp/uv-cache
    working_dir: /app
    environment:
      HOST_PROJECT_DIR: ${PWD}
      UV_CACHE_DIR: /tmp/uv-cache

volumes:
  bundle_cache:
  uv_cache:
