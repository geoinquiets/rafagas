services:
  jekyll:
    image: jekyll/jekyll:latest
    command: jekyll serve --watch --force_polling --incremental --port 8000 --livereload --livereload-port --future
    volumes:
      - .:/srv/jekyll
      - ./vendor/bundle:/usr/local/bundle:Z"
    ports:
      - '8000:8000'
      - '35729:35729'
    environment: 
      RUBYOPT: '-W0'
      JEKYLL_ENV: production 
