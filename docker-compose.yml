services:
  jekyll:
    image: jekyll/jekyll:latest
    command: jekyll serve --watch --force_polling --incremental --port 8000 --livereload --livereload-port --future --drafts --limit_posts 50
    volumes:
      - ".:/srv/jekyll:Z"
      - bundle_cache:/usr/local/bundle
    ports:
      - '8000:8000'
      - '35729:35729'
    extra_hosts:
      - "api.github.com:127.0.0.1"
    environment: 
      RUBYOPT: '-W0'
      JEKYLL_ENV: production
      BUNDLE_PATH: /usr/local/bundle

volumes:
  bundle_cache:
